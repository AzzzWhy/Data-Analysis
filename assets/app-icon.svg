<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">GPU加速与数据分析</title>
  <desc id="desc">Three rising bars on a dark tile.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#222a42"/>
      <stop offset="1" stop-color="#12182c"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d5dcf4" stop-opacity=".5"/>
      <stop offset=".5" stop-color="#8b97c9" stop-opacity=".08"/>
      <stop offset="1" stop-color="#b7c0e4" stop-opacity=".38"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#surface)"/>
  <rect x="5.25" y="5.25" width="117.5" height="117.5" rx="31" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
  <rect x="30" y="68" width="16" height="28" rx="5" fill="#6e7ab4"/>
  <rect x="56" y="48" width="16" height="48" rx="5" fill="#a8b2dc"/>
  <rect x="82" y="26" width="16" height="70" rx="5" fill="#f4f6fb"/>
</svg>
