    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="29" fill="url(#surface)" stroke="#443a35" stroke-width="2"/>
  <rect x="25" y="74" width="20" height="30" rx="5" fill="#886f65"/>
  <rect x="54" y="55" width="20" height="49" rx="5" fill="#b18a78"/>
  <rect x="83" y="31" width="20" height="73" rx="5" fill="url(#bars)"/>
